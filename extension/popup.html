<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NeuroBridge</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      color: #1a56db;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
    }

    .status.inactive {
      background: #f3f4f6;
      color: #6b7280;
    }

    .status.active {
      background: #dcfce7;
      color: #166534;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #1a56db;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e40af;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .session-info {
      margin: 16px 0;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 12px;
    }

    .session-info label {
      display: block;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .session-info input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .error {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>NeuroBridge</h1>
    <div class="subtitle">AI Clinical Assistant</div>
  </div>

  <div id="status" class="status inactive">
    Not capturing
  </div>

  <div id="sessionInfo" class="session-info">
    <label>Session ID:</label>
    <input type="text" id="sessionId" placeholder="Enter session ID" />
  </div>

  <button id="startBtn" class="btn-primary">
    Start Capture
  </button>

  <button id="stopBtn" class="btn-danger" style="display: none;">
    Stop Capture
  </button>

  <div id="error" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
